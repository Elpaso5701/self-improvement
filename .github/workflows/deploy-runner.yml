name: 🚀 Hetzner Ephemeral Runner Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'utils.py'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: hetzner-runner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

# ═══════════════════════════════════════
# 1️⃣ CREATE RUNNER (FAILOVER SAFE)
# ═══════════════════════════════════════
  create-runner:
    runs-on: ubuntu-latest

    outputs:
      label: ${{ steps.create.outputs.label }}
      server_id: ${{ steps.create.outputs.server_id }}

    steps:
      - name: Create runner with failover
        id: create
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e

          LOCATIONS=("nbg1" "fsn1" "hel1")
          LABEL="gh-runner-${{ github.run_id }}"

          echo "Starting failover provisioning..."

          for LOC in "${LOCATIONS[@]}"; do
            echo "▶ Trying: $LOC"

            RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer $HCLOUD_TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.hetzner.cloud/v1/servers" \
              -d "{
                \"name\": \"$LABEL\",
                \"server_type\": \"cx23\",
                \"image\": \"ubuntu-22.04\",
                \"location\": \"$LOC\"
              }")

            SERVER_ID=$(echo "$RESPONSE" | jq -r '.server.id // empty')

            if [[ -n "$SERVER_ID" ]]; then
              echo "✓ Created in $LOC (ID: $SERVER_ID)"

              echo "label=$LABEL" >> $GITHUB_OUTPUT
              echo "server_id=$SERVER_ID" >> $GITHUB_OUTPUT

              exit 0
            fi

            echo "✗ $LOC failed"
          done

          echo "❌ All regions failed"
          exit 1

# ═══════════════════════════════════════
# 2️⃣ RUN TESTS
# ═══════════════════════════════════════
  test:
    needs: create-runner

    runs-on: ${{ needs.create-runner.outputs.label }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - uses: actions/setup-python@c8813ba1bc76ebf779b911ad8ffccbf2e449cb48
        with:
          python-version: "3.11.9"

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          export PYTHONPATH=$PWD
          pytest tests/ -v --tb=short

# ═══════════════════════════════════════
# 3️⃣ CLEANUP (STABLE — NO CUSTOM LOGIC)
# ═══════════════════════════════════════
  delete-runner:
    needs:
      - create-runner
      - test

    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Safe cleanup via official action
        continue-on-error: true
        uses: Cyclenerd/hcloud-github-runner@54da4707b01dfca5dd38cd15cde4afcd950f2b4a
        with:
          mode: delete
          github_token: ${{ secrets.GH_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          server_id: ${{ needs.create-runner.outputs.server_id }}