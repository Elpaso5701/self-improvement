name: 🚀 Hetzner Ephemeral Runner Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'utils.py'
      - 'tests/**'

  workflow_dispatch:

jobs:

  # ═══════════════════════════════════════
  # 1️⃣ CREATE RUNNER (Hetzner VM + GitHub Runner)
  # ═══════════════════════════════════════
  create-runner:
    name: Create Hetzner Runner
    runs-on: ubuntu-latest

    outputs:
      label: ${{ steps.runner.outputs.label }}
      server_id: ${{ steps.runner.outputs.server_id }}

    steps:
      - name: Create runner
        id: runner
        uses: Cyclenerd/hcloud-github-runner@v1
        with:
          mode: create

          github_token: ${{ secrets.GH_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}

          server_type: cx23
          location: nbg1
          image: ubuntu-22.04

          # ✔ стабильный label для matching
          labels: self-hosted,hetzner,ephemeral,gh-runner

  # ═══════════════════════════════════════
  # 2️⃣ RUN TESTS (на VM runner)
  # ═══════════════════════════════════════
  test:
    name: Run Tests
    needs: create-runner

    runs-on: ${{ needs.create-runner.outputs.label }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest httpx

      - name: Run tests
        run: |
          echo "Running tests on Hetzner VM..."
          PYTHONPATH=. pytest tests -v

  # ═══════════════════════════════════════
  # 3️⃣ DELETE RUNNER (cleanup always)
  # ═══════════════════════════════════════
  delete-runner:
    name: Delete Hetzner Runner
    needs:
      - create-runner
      - test

    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Delete runner + VM
        uses: Cyclenerd/hcloud-github-runner@v1
        with:
          mode: delete

          github_token: ${{ secrets.GH_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}

          server_id: ${{ needs.create-runner.outputs.server_id }}