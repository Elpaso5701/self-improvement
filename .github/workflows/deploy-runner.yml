name: 🚀 Hetzner Ephemeral Runner Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'utils.py'
      - 'tests/**'
  workflow_dispatch:

jobs:

  # ═══════════════════════════════════════
  # 1️⃣ CREATE RUNNER
  # ═══════════════════════════════════════
  create-runner:
    runs-on: ubuntu-latest

    outputs:
      server_id: ${{ steps.runner.outputs.server_id }}
      label: ${{ steps.runner.outputs.label }}

    steps:
      - name: Create runner
        id: runner
        uses: Cyclenerd/hcloud-github-runner@v1
        with:
          mode: create
          github_token: ${{ secrets.GH_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          server_type: cx23
          location: nbg1
          image: ubuntu-22.04

  # ═══════════════════════════════════════
  # 2️⃣ RUN TESTS
  # ═══════════════════════════════════════
  test:
    needs: create-runner
    runs-on: ${{ needs.create-runner.outputs.label }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - name: Setup Python
        uses: actions/setup-python@c8813ba1bc76ebf779b911ad8ffccbf2e449cb48
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: |
          set -e

          echo "⏳ Running tests on ephemeral runner..."

          export PYTHONPATH=$PWD

          pytest tests/ -v --tb=short

          echo "✓ Tests completed successfully"

  # ═══════════════════════════════════════
  # 3️⃣ CLEANUP
  # ═══════════════════════════════════════
  delete-runner:
    needs:
      - create-runner
      - test

    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Delete runner + VM
        continue-on-error: true
        uses: Cyclenerd/hcloud-github-runner@54da4707b01dfca5dd38cd15cde4afcd950f2b4a
        with:
          mode: delete

          github_token: ${{ secrets.GH_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}

          server_id: ${{ needs.create-runner.outputs.server_id }}