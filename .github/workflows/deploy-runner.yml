name: 🚀 Deploy Hetzner Runner & Test

on:
  pull_request:
    branches: [main]
    paths:
      - 'utils.py'
      - 'tests/**'
  workflow_dispatch:

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # 1️⃣ DEPLOY
  # ══════════════════════════════════════════════════════════════════════════
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      server_id: ${{ steps.create_server.outputs.server_id }}
      server_name: ${{ steps.create_server.outputs.server_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Get GitHub runner token
        id: reg_token
        run: |
          TOKEN=$(curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners/registration-token" \
            | jq -r '.token')

          [[ -z "$TOKEN" || "$TOKEN" == "null" ]] && exit 1
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Create Hetzner VPS
        id: create_server
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          REG_TOKEN: ${{ steps.reg_token.outputs.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          SERVER_NAME="gh-runner-${{ github.run_id }}"
          echo "server_name=$SERVER_NAME" >> $GITHUB_OUTPUT

          CLOUD_INIT=$(envsubst '${CF_TUNNEL_TOKEN} ${REG_TOKEN} ${GITHUB_REPO} ${SERVER_NAME}' < scripts/cloud-init.sh)

          LOCATIONS=("nbg1" "fsn1" "hel1")
          SERVER_ID=""

          for LOCATION in "${LOCATIONS[@]}"; do
            RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.hetzner.cloud/v1/servers" \
              -d "{
                \"name\": \"${SERVER_NAME}\",
                \"server_type\": \"cx23\",
                \"image\": \"ubuntu-22.04\",
                \"location\": \"${LOCATION}\",
                \"user_data\": $(echo "$CLOUD_INIT" | jq -Rs .),
                \"public_net\": {\"enable_ipv4\": true, \"enable_ipv6\": false}
              }")

            SERVER_ID=$(echo "$RESPONSE" | jq -r '.server.id')

            if [[ -n "$SERVER_ID" && "$SERVER_ID" != "null" ]]; then
              break
            fi
          done

          [[ -z "$SERVER_ID" || "$SERVER_ID" == "null" ]] && exit 1

          echo "server_id=$SERVER_ID" >> $GITHUB_OUTPUT

      # 🔍 DEBUG (важно)
      - name: Debug runner state
        run: |
          curl -s \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runners" \
            | jq '.runners[] | {name, status, busy, labels}'

      # ⏳ WAIT FOR RUNNER
      - name: Wait for runner
        env:
          SERVER_NAME: ${{ steps.create_server.outputs.server_name }}
        run: |
          echo "Waiting for runner..."

          sleep 20

          for i in $(seq 1 40); do
            RUNNER=$(curl -s \
              -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runners" \
              | jq -r --arg name "$SERVER_NAME" '
                (.runners // [])
                | map(select(.name == $name and .status == "online" and .busy == false))
                | .[0].name // empty
              ')

            if [[ -n "$RUNNER" ]]; then
              echo "Runner ready!"
              exit 0
            fi

            sleep 10
          done

          echo "Runner timeout"
          exit 1

  # ══════════════════════════════════════════════════════════════════════════
  # 2️⃣ TEST
  # ══════════════════════════════════════════════════════════════════════════
  test:
    needs: deploy
    uses: ./.github/workflows/run-tests.yml
    with:
      runner_label: gh-runner-${{ github.run_id }}

  # ══════════════════════════════════════════════════════════════════════════
  # 3️⃣ CLEANUP
  # ══════════════════════════════════════════════════════════════════════════
  cleanup:
    if: always()
    needs: [deploy, test]
    runs-on: ubuntu-latest

    steps:
      - name: Delete server
        env:
          SERVER_ID: ${{ needs.deploy.outputs.server_id }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          [[ -z "$SERVER_ID" ]] && exit 0

          curl -s -X DELETE \
            -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
            "https://api.hetzner.cloud/v1/servers/${SERVER_ID}"