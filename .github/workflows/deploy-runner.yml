name: 🚀 Hetzner Ephemeral Runner Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'utils.py'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: hetzner-runner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

# ═══════════════════════════════════════
# 1️⃣ CREATE RUNNER (FAILOVER WRAPPER)
# ═══════════════════════════════════════
  create-runner:
    runs-on: ubuntu-latest

    outputs:
      server_id: ${{ steps.create.outputs.server_id }}
      label: ${{ steps.create.outputs.label }}
      location: ${{ steps.create.outputs.location }}

    steps:
      - name: Create Hetzner runner (multi-region failover)
        id: create
        uses: Cyclenerd/hcloud-github-runner@54da4707b01dfca5dd38cd15cde4afcd950f2b4a
        with:
          mode: create
          github_token: ${{ secrets.GH_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}

          server_type: cx23
          image: ubuntu-22.04

          # fallback logic handled manually BEFORE call
          location: nbg1

      - name: Retry fallback regions if needed
        id: failover
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
        run: |
          set -e

          LOCATIONS=("nbg1" "fsn1" "hel1")

          for LOC in "${LOCATIONS[@]}"; do
            echo "▶ Trying region: $LOC"

            RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.hetzner.cloud/v1/servers" \
              -d "{
                \"name\": \"gh-runner-${{ github.run_id }}\",
                \"server_type\": \"cx23\",
                \"image\": \"ubuntu-22.04\",
                \"location\": \"${LOC}\"
              }")

            SERVER_ID=$(echo "$RESPONSE" | jq -r '.server.id // empty')

            if [[ -n "$SERVER_ID" ]]; then
              echo "server_id=$SERVER_ID" >> $GITHUB_OUTPUT
              echo "location=$LOC" >> $GITHUB_OUTPUT
              echo "label=gh-runner-${{ github.run_id }}" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "✗ failed in $LOC"
          done

          echo "❌ all regions failed"
          exit 1

# ═══════════════════════════════════════
# 2️⃣ RUN TESTS
# ═══════════════════════════════════════
  test:
    needs: create-runner

    runs-on: ${{ needs.create-runner.outputs.label }}
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - name: Setup Python
        uses: actions/setup-python@c8813ba1bc76ebf779b911ad8ffccbf2e449cb48
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: |
          set -e
          export PYTHONPATH=$PWD
          pytest tests/ -v --tb=short

# ═══════════════════════════════════════
# 3️⃣ DELETE RUNNER
# ═══════════════════════════════════════
  delete-runner:
    needs:
      - create-runner
      - test

    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Cleanup runner
        uses: Cyclenerd/hcloud-github-runner@54da4707b01dfca5dd38cd15cde4afcd950f2b4a
        with:
          mode: delete
          github_token: ${{ secrets.GH_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          server_id: ${{ needs.create-runner.outputs.server_id }}