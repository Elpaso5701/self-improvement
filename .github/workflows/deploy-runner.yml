name: 🚀 Hetzner Ephemeral Runner Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'utils.py'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: hetzner-runner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

# ═══════════════════════════════════════
# 1️⃣ CREATE RUNNER (multi-region failover)
# ═══════════════════════════════════════
  create-runner:
    runs-on: ubuntu-latest

    outputs:
      server_id: ${{ steps.create.outputs.server_id }}
      label: ${{ steps.create.outputs.label }}
      location: ${{ steps.create.outputs.location }}

    steps:
      - name: Create Hetzner runner (failover)
        id: create
        shell: bash
        env:
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -e

          LOCATIONS=("nbg1" "fsn1" "hel1")

          SERVER_ID=""
          LOCATION=""
          LABEL="gh-runner-${{ github.run_id }}"

          echo "Starting multi-region provisioning..."

          for LOC in "${LOCATIONS[@]}"; do
            echo "▶ Trying region: $LOC"

            RESPONSE=$(curl -s -X POST \
              -H "Authorization: Bearer ${HCLOUD_TOKEN}" \
              -H "Content-Type: application/json" \
              "https://api.hetzner.cloud/v1/servers" \
              -d "{
                \"name\": \"${LABEL}\",
                \"server_type\": \"cx23\",
                \"image\": \"ubuntu-22.04\",
                \"location\": \"${LOC}\",
                \"public_net\": {
                  \"enable_ipv4\": true,
                  \"enable_ipv6\": false
                }
              }")

            SERVER_ID=$(echo "$RESPONSE" | jq -r '.server.id // empty')

            if [[ -n "$SERVER_ID" ]]; then
              LOCATION="$LOC"
              echo "✓ Server created in ${LOCATION} (ID: ${SERVER_ID})"
              break
            fi

            echo "✗ ${LOC} failed, trying next..."
          done

          if [[ -z "$SERVER_ID" ]]; then
            echo "❌ Failed to create server in all regions"
            exit 1
          fi

          echo "server_id=$SERVER_ID" >> $GITHUB_OUTPUT
          echo "label=$LABEL" >> $GITHUB_OUTPUT
          echo "location=$LOCATION" >> $GITHUB_OUTPUT

  # ═══════════════════════════════════════
  # 2️⃣ RUN TESTS
  # ═══════════════════════════════════════
  test:
    needs: create-runner
    runs-on: ${{ needs.create-runner.outputs.label }}
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - name: Setup Python
        uses: actions/setup-python@c8813ba1bc76ebf779b911ad8ffccbf2e449cb48
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: |
          set -e

          echo "⏳ Running tests on ephemeral runner..."

          export PYTHONPATH=$PWD

          pytest tests/ -v --tb=short

          echo "✓ Tests completed successfully"

  # ═══════════════════════════════════════
  # 3️⃣ CLEANUP
  # ═══════════════════════════════════════
  delete-runner:
    needs:
      - create-runner
      - test

    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Delete runner + VM
        continue-on-error: true
        uses: Cyclenerd/hcloud-github-runner@54da4707b01dfca5dd38cd15cde4afcd950f2b4a
        with:
          mode: delete

          github_token: ${{ secrets.GH_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}

          server_id: ${{ needs.create-runner.outputs.server_id }}