name: 🚀 Hetzner Ephemeral Runner Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'utils.py'
      - 'tests/**'
  workflow_dispatch:

concurrency:
  group: hetzner-runner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  # ═══════════════════════════════════════
  # 1️⃣ CREATE RUNNER (region failover)
  # ═══════════════════════════════════════
  create-runner:
    runs-on: ubuntu-latest

    outputs:
      server_id: ${{ steps.final.outputs.server_id }}
      label: ${{ steps.final.outputs.label }}
      location: ${{ steps.final.outputs.location }}

    steps:

      # Try NBG1
      - name: Try nbg1
        id: nbg1
        continue-on-error: true
        uses: Cyclenerd/hcloud-github-runner@54da4707b01dfca5dd38cd15cde4afcd950f2b4a
        with:
          mode: create
          github_token: ${{ secrets.GH_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          server_type: cx23
          location: nbg1
          image: ubuntu-22.04

      # Try FSN1
      - name: Try fsn1
        id: fsn1
        if: steps.nbg1.outcome == 'failure'
        continue-on-error: true
        uses: Cyclenerd/hcloud-github-runner@54da4707b01dfca5dd38cd15cde4afcd950f2b4a
        with:
          mode: create
          github_token: ${{ secrets.GH_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          server_type: cx23
          location: fsn1
          image: ubuntu-22.04

      # Try HEL1
      - name: Try hel1
        id: hel1
        if: steps.nbg1.outcome == 'failure' && steps.fsn1.outcome == 'failure'
        uses: Cyclenerd/hcloud-github-runner@54da4707b01dfca5dd38cd15cde4afcd950f2b4a
        with:
          mode: create
          github_token: ${{ secrets.GH_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          server_type: cx23
          location: hel1
          image: ubuntu-22.04

      - name: Select successful region
        id: final
        shell: bash
        run: |
          if [[ "${{ steps.nbg1.outcome }}" == "success" ]]; then
            echo "server_id=${{ steps.nbg1.outputs.server_id }}" >> $GITHUB_OUTPUT
            echo "label=${{ steps.nbg1.outputs.label }}" >> $GITHUB_OUTPUT
            echo "location=nbg1" >> $GITHUB_OUTPUT

          elif [[ "${{ steps.fsn1.outcome }}" == "success" ]]; then
            echo "server_id=${{ steps.fsn1.outputs.server_id }}" >> $GITHUB_OUTPUT
            echo "label=${{ steps.fsn1.outputs.label }}" >> $GITHUB_OUTPUT
            echo "location=fsn1" >> $GITHUB_OUTPUT

          elif [[ "${{ steps.hel1.outcome }}" == "success" ]]; then
            echo "server_id=${{ steps.hel1.outputs.server_id }}" >> $GITHUB_OUTPUT
            echo "label=${{ steps.hel1.outputs.label }}" >> $GITHUB_OUTPUT
            echo "location=hel1" >> $GITHUB_OUTPUT

          else
            echo "❌ All regions failed"
            exit 1
          fi

  # ═══════════════════════════════════════
  # 2️⃣ RUN TESTS
  # ═══════════════════════════════════════
  test:
    needs: create-runner
    runs-on: ${{ needs.create-runner.outputs.label }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - uses: actions/setup-python@c8813ba1bc76ebf779b911ad8ffccbf2e449cb48
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        run: |
          export PYTHONPATH=$PWD
          pytest tests/ -v --tb=short

  # ═══════════════════════════════════════
  # 3️⃣ CLEANUP
  # ═══════════════════════════════════════
  delete-runner:
    needs: [create-runner, test]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Delete runner + VM
        continue-on-error: true
        uses: Cyclenerd/hcloud-github-runner@54da4707b01dfca5dd38cd15cde4afcd950f2b4a
        with:
          mode: delete
          github_token: ${{ secrets.GH_PAT }}
          hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          server_id: ${{ needs.create-runner.outputs.server_id }}