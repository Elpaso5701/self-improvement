name: 🧪 Run Tests (Ephemeral Runner)

on:
  workflow_call:
    inputs:
      runner_label:
        required: true
        type: string

jobs:
  test:
    runs-on: [self-hosted, ${{ inputs.runner_label }}]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -q pytest==7.4.3 httpx==0.24.1

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Report result
        if: always()
        run: |
          echo "Tests finished with status: ${{ job.status }}"