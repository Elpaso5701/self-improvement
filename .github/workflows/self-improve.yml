name: 🤖 LLM Self-Improvement Agent

on:
  schedule:
    - cron: '0 */2 * * *'   # каждые 2 часа
  workflow_dispatch:          # ручной запуск для тестов

permissions:
  contents: write
  pull-requests: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install openai==1.3.0 httpx==0.24.1 pytest==7.4.3

      - name: Run LLM improvement agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: .
        run: python scripts/improve_agent.py

      - name: Run tests after improvement
        run: PYTHONPATH=. pytest tests/ -v --tb=short

      #SecOps: Создаём PR только если все тесты прошли успешно  
      - name: Create Pull Request with improvements
        if: success()
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "🤖 Auto-improvement: $(date -u '+%Y-%m-%d %H:%M UTC')"
          title: "🤖 Auto-improvement from LLM Agent"
          body: |
            ## 🤖 Automatic Code Improvements
            
            This PR contains automatic code improvements generated by the LLM agent:
            - ✅ Added type hints
            - ✅ Improved docstrings
            - ✅ Enhanced code quality
            - ✅ All tests passing
            
            **Generated at:** $(date -u '+%Y-%m-%d %H:%M UTC')
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: auto-improve/${{ github.run_id }}
          delete-branch: true
          labels: |
            🤖 automated
            ✨ enhancement
          assignees: |
            ${{ github.repository_owner }}
          reviewers: |
            ${{ github.repository_owner }}

      - name: Log PR creation result
        if: always()
        run: |
          echo "════════════════════════════════════════"
          echo "🤖 Improvement Workflow Summary"
          echo "════════════════════════════════════════"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "════════════════════════════════════════"  
    
    #  Альтернативный вариант — коммитить прямо в main (без PR), но это рискованно для продакшена. PR позволяет безопасно проверять изменения и сохранять историю улучшений.      
