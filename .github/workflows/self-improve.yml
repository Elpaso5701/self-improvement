name: 🤖 LLM Self-Improvement Agent

on:
  
  # schedule:
  #   - cron: '0 */2 * * *'  
  workflow_dispatch:        

concurrency:
  group: llm-improvement
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@c8813ba1bc76ebf779b911ad8ffccbf2e449cb48
        with:
          python-version: '3.11.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run LLM improvement agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: .
        run: python scripts/improve_agent.py
        timeout-minutes: 5

      - name: Run tests after improvement
        run: PYTHONPATH=. pytest tests/ -v --tb=short

      - name: Create Pull Request with improvements
        if: success()
        uses: peter-evans/create-pull-request@aa523f9db61947bd5e06efd77870ef065eae32cc
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "🤖 Auto-improvement"
          title: "🤖 Auto-improvement from LLM Agent"
          body: |
            ## 🤖 Automatic Code Improvements
            
            This PR contains automatic code improvements generated by the LLM agent:
            - ✅ Added type hints
            - ✅ Improved docstrings
            - ✅ Enhanced code quality
            - ✅ All tests passing
            
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: auto-improve/${{ github.run_id }}
          delete-branch: true
          labels: |
            🤖 automated
            ✨ enhancement
          assignees: |
            ${{ github.repository_owner }}

      - name: Log PR creation result
        if: always()
        run: |
          echo "════════════════════════════════════════"
          echo "🤖 Improvement Workflow Summary"
          echo "════════════════════════════════════════"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "════════════════════════════════════════"  
    
