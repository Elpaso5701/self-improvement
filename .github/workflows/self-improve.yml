name: 🤖 LLM Self-Improvement Agent

on:
  schedule:
    - cron: '0 */2 * * *'   # каждые 2 часа
  workflow_dispatch:          # ручной запуск для тестов

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install openai==1.3.0 pytest==7.4.3

      - name: Run LLM improvement agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/improve_agent.py

      - name: Run tests after improvement
        run: pytest tests/ -v --tb=short

      - name: Commit improvements
        run: |
          git config --global user.name  "Self-Improvement Bot"
          git config --global user.email "bot@self-improve.ai"

          git diff --quiet && git diff --staged --quiet && echo "No changes" && exit 0

          git add -A
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
          git commit -m "🤖 Auto-improvement: $TIMESTAMP"
          git push